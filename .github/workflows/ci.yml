name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Syntax check
        run: python -m py_compile relay.py tests/test_relay.py tests/conftest.py
      - name: Pytest
        run: pytest -q
      - name: Smoke test
        run: bash scripts/smoke.sh
        env:
          PORT: "8791"

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg RELAY_REVISION="${GITHUB_SHA::7}" -t spontaneouscolab:ci .
      - name: Run container and probe health
        run: |
          docker run -d --name relay-ci -p 8787:8787 spontaneouscolab:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs relay-ci
          docker rm -f relay-ci
          exit 1
